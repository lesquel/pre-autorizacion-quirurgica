<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pre-Autorización Quirúrgica">
  <title>Pre-Autorización Quirúrgica</title>
  <!--
    Brand mark reusado del topbar:
      bg-ink (#14130F) cuadrado redondeado con un cuadrado accent al medio.
    Coordenadas:
      base 32×32 con radio 6 (matches Tailwind rounded-lg).
      inner square 10×10 centrado (11,11 → 21,21).
    El accent teal está hardcoded como hex (en lugar de oklch) para que el
    favicon renderice en todos los navegadores — el .svg favicon se carga
    antes de que ningún CSS variable esté definido.
  -->
  <rect width="32" height="32" rx="6" fill="#14130F"/>
  <rect x="11" y="11" width="10" height="10" fill="#2EA89B"/>
</svg>
